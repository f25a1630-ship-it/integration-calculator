<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Definite Integration Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col items-center p-4 sm:p-8">

    <main class="w-full max-w-4xl bg-white shadow-xl rounded-2xl p-6 border border-slate-100">
        <header class="mb-6 text-center sm:text-left">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Definite Integration Calculator</h1>
            <p class="text-slate-500 text-sm mt-1">Visualize and calculate the area under a curve using Riemann sums.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <section class="lg:col-span-1 flex flex-col gap-5">
                
                <div>
                    <label for="eq-input" class="block text-sm font-semibold text-slate-700 mb-1">Function $f(x)$</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2.5 text-slate-400 italic">f(x) =</span>
                        <input id="eq-input" type="text" value="x^2 - 2x + 2" 
                            class="w-full pl-14 pr-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm shadow-sm transition">
                    </div>
                    <p id="error-msg" class="text-xs text-red-500 mt-1 hidden font-medium">Invalid mathematical expression.</p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="lower-bound" class="block text-sm font-semibold text-slate-700 mb-1">Lower Bound ($a$)</label>
                        <input id="lower-bound" type="number" value="0" step="any"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm transition">
                    </div>
                    <div>
                        <label for="upper-bound" class="block text-sm font-semibold text-slate-700 mb-1">Upper Bound ($b$)</label>
                        <input id="upper-bound" type="number" value="4" step="any"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm transition">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="intervals" class="text-sm font-semibold text-slate-700">Number of Rectangles ($n$)</label>
                        <span id="intervals-val" class="text-sm font-mono font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">20</span>
                    </div>
                    <input id="intervals" type="range" min="2" max="100" value="20" step="1"
                        class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                </div>

                <hr class="border-slate-100 my-1">

                <div class="bg-slate-50 border border-slate-200/60 rounded-xl p-4 flex flex-col gap-3 shadow-inner">
                    <div>
                        <span class="block text-xs uppercase tracking-wider font-bold text-slate-400">Estimated Area ($I$)</span>
                        <div id="result-display" class="text-2xl font-mono font-bold text-slate-900 mt-0.5">0.0000</div>
                    </div>
                    <div class="text-xs text-slate-500 space-y-1 font-medium">
                        <p>$\Delta x$ (Width): <span id="dx-display" class="font-mono text-slate-700 font-semibold">0.00</span></p>
                        <p>Method: <span class="text-slate-700 font-semibold">Midpoint Riemann Sum</span></p>
                    </div>
                </div>
            </section>

            <section class="lg:col-span-2 bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center justify-center min-h-[350px] lg:min-h-[400px] relative">
                <canvas id="plot-canvas" class="w-full h-full"></canvas>
            </section>
        </div>
    </main>

    <footer class="mt-6 text-xs text-slate-400 text-center">
        Built with Math.js & Chart.js. Real-time updates on input change.
    </footer>

    <script>
        // DOM Elements
        const eqInput = document.getElementById('eq-input');
        const lowerBoundInput = document.getElementById('lower-bound');
        const upperBoundInput = document.getElementById('upper-bound');
        const intervalsInput = document.getElementById('intervals');
        const intervalsVal = document.getElementById('intervals-val');
        const resultDisplay = document.getElementById('result-display');
        const dxDisplay = document.getElementById('dx-display');
        const errorMsg = document.getElementById('error-msg');
        const ctx = document.getElementById('plot-canvas').getContext('2d');

        let chart;

        // Safely evaluate function at a specific x value using Math.js
        function evaluateFunction(expr, x) {
            try {
                return expr.evaluate({ x: x });
            } catch (e) {
                return null;
            }
        }

        // Main Calculation and Plotting routine
        function update() {
            const rawExpr = eqInput.value;
            let expr;
            
            // Parse expression
            try {
                expr = math.parse(rawExpr).compile();
                errorMsg.classList.add('hidden');
            } catch (e) {
                errorMsg.classList.remove('hidden');
                return;
            }

            const a = parseFloat(lowerBoundInput.value);
            const b = parseFloat(upperBoundInput.value);
            const n = parseInt(intervalsInput.value);
            intervalsVal.textContent = n;

            if (isNaN(a) || !isFinite(a) || isNaN(b) || !isFinite(b) || a >= b) {
                resultDisplay.textContent = "Error: Bounds";
                return;
            }

            const dx = (b - a) / n;
            dxDisplay.textContent = dx.toFixed(4);

            // Calculate Riemann Midpoint Sum & build rectangle datasets
            let totalArea = 0;
            const rectangleDatasets = [];

            for (let i = 0; i < n; i++) {
                const xLeft = a + i * dx;
                const xRight = xLeft + dx;
                const xMid = xLeft + dx / 2;
                const yMid = evaluateFunction(expr, xMid);

                if (yMid === null || isNaN(yMid)) continue;

                totalArea += yMid * dx;

                // Create standard Chart.js bar structure data points for coordinates
                // We construct a polygon/line loop to draw sharp step-rectangles safely
                rectangleDatasets.push({
                    label: i === 0 ? 'Riemann Rectangles' : '', // Label only first for cleaner legend
                    data: [
                        {x: xLeft, y: 0},
                        {x: xLeft, y: yMid},
                        {x: xRight, y: yMid},
                        {x: xRight, y: 0}
                    ],
                    borderColor: 'rgba(59, 130, 246, 0.45)',
                    backgroundColor: 'rgba(59, 130, 246, 0.15)',
                    borderWidth: 1.5,
                    fill: true,
                    pointRadius: 0,
                    tension: 0,
                    showLine: true
                });
            }

            resultDisplay.textContent = totalArea.toFixed(5);

            // Generate main smooth curve data points
            const curveData = [];
            const padding = (b - a) * 0.25 || 1; // dynamically scale context padding edges
            const startX = a - padding;
            const endX = b + padding;
            const steps = 150; 

            for (let i = 0; i <= steps; i++) {
                const x = startX + (i * (endX - startX)) / steps;
                const y = evaluateFunction(expr, x);
                if (y !== null && isFinite(y)) {
                    curveData.push({ x: x, y: y });
                }
            }

            const lineDataset = {
                label: 'f(x)',
                data: curveData,
                borderColor: '#0f172a',
                borderWidth: 2.5,
                fill: false,
                pointRadius: 0,
                tension: 0.1, // Smooth curvature
                showLine: true
            };

            // Compile all lines safely to redraw layout
            const allDatasets = [lineDataset, ...rectangleDatasets];

            if (chart) {
                chart.data.datasets = allDatasets;
                chart.options.scales.x.min = startX;
                chart.options.scales.x.max = endX;
                chart.update('none'); // Quick updates without lagging structural refreshes
            } else {
                chart = new Chart(ctx, {
                    type: 'scatter',
                    data: { datasets: allDatasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    filter: function(item) {
                                        // Keep only the actual function line and the first rectangle label
                                        return item.text === 'f(x)' || item.text === 'Riemann Rectangles';
                                    }
                                }
                            },
                            tooltip: { enabled: false } // Avoid spam popups while hovering on dense areas
                        },
                        scales: {
                            x: {
                                type: 'linear',
                                position: 'bottom',
                                min: startX,
                                max: endX,
                                grid: { color: '#e2e8f0' }
                            },
                            y: {
                                type: 'linear',
                                grid: { color: '#e2e8f0' }
                            }
                        }
                    }
                });
            }
        }

        // Attach Instant Event Listeners
        [eqInput, lowerBoundInput, upperBoundInput, intervalsInput].forEach(element => {
            element.addEventListener('input', update);
        });

        // Initialize App on Startup
        update();
    </script>
</body>
</html>
